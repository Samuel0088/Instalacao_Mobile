<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="transparent">
    <meta name="msapplication-navbutton-color" content="transparent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zenith" />
    <link rel="icon" type="image/png" href="/assets/icons/Logo.png" />
    <link rel="apple-touch-icon" href="/assets/icons/Logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">
    <title>Zenith</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background-color: #102419;
        background:
          radial-gradient(circle at 82% 18%, rgba(86, 168, 112, 0.38), transparent 34%),
          linear-gradient(135deg, #102419 0%, #1e4229 54%, #3d8057 100%);
      }

      body {
        overflow-x: hidden;
      }

      .boot-splash {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #14d98b;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        font-size: clamp(2.2rem, 9vw, 4.2rem);
        font-weight: 900;
        line-height: 1;
        text-shadow: 0 16px 40px rgba(20, 217, 139, 0.18);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">Zenith</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
